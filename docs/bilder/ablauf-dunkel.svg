<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 544" class="d-quer" role="img" aria-labelledby="dq-titel dq-text"><title id="dq-titel">Aufbau von „Rede mit Meinungsmache“</title><desc id="dq-text">Stündlich prüft ein Abruf den RSS-Feed von meinungsmache.de, für das Archiv einmalig die Sitemap. Neue und geänderte Artikel werden von ihrer Seite gelesen und in Titel, Dachzeile, Text, Quelle, Autor und Links zerlegt; ein lokales Einbettungsmodell berechnet Vektoren. Alles landet in MariaDB. Bei jeder Frage ruft ein KI-Assistent die MCP-Schnittstelle auf; sie sucht in der Datenbank und liefert Artikel mit Links zu meinungsmache.de und zur Originalquelle zurück.</desc><style>
.d-bahn{fill:#151b23;stroke:#3d444d;stroke-dasharray:4 4}
.d-bahntitel{fill:#9198a1;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.d-kasten{fill:#0d1117;stroke:#3d444d;stroke-width:1.2}
.d-t{fill:#e6edf3;font-size:15px;font-weight:600}
.d-d{fill:#9198a1;font-size:12.5px}
.d-f{fill:#e0a94f;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace}
.d-p{fill:none;stroke:#9198a1;stroke-width:1.4;stroke-linejoin:round}
.d-p.b{stroke:#5eb8a8;stroke-width:1.6}
.d-s{fill:#9198a1}.d-s.b{fill:#5eb8a8}
.d-l{fill:#9198a1;font-size:11.5px}.d-l.b{fill:#5eb8a8}
.d-chip{fill:#0d1117;stroke:#5eb8a8;stroke-width:1.1}
.d-chiptext{fill:#5eb8a8;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.d-hinweis{fill:#5eb8a8;font-size:11.5px;font-weight:600}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}</style><defs><marker id="dq-s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker><marker id="dq-sb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s b" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker></defs><rect class="d-bahn" x="4" y="4" width="856" height="272" rx="14"/><text class="d-bahntitel" x="20" y="26">Stündlich: Abruf von meinungsmache.de</text><rect class="d-kasten" x="20" y="52" width="200" height="70" rx="10"/><text class="d-t" x="120" y="83" text-anchor="middle">RSS-Feed</text><text class="d-d" x="120" y="101" text-anchor="middle">neue und geänderte Artikel</text><rect class="d-kasten" x="20" y="168" width="200" height="70" rx="10"/><text class="d-t" x="120" y="199" text-anchor="middle">Sitemap</text><text class="d-d" x="120" y="217" text-anchor="middle">Archiv seit Dezember 2025</text><rect class="d-kasten" x="250" y="110" width="230" height="70" rx="10"/><text class="d-t" x="365" y="134" text-anchor="middle">Abruf</text><text class="d-d" x="365" y="152" text-anchor="middle">Artikelseite lesen und zerlegen</text><text class="d-f" x="365" y="170" text-anchor="middle">abruf.php · quelle.php</text><rect class="d-kasten" x="510" y="52" width="190" height="70" rx="10"/><text class="d-t" x="605" y="83" text-anchor="middle">Artikel</text><text class="d-d" x="605" y="101" text-anchor="middle">Text, Quelle, Autor, Links</text><rect class="d-kasten" x="510" y="168" width="190" height="70" rx="10"/><text class="d-t" x="605" y="199" text-anchor="middle">Vektoren</text><text class="d-d" x="605" y="217" text-anchor="middle">Qwen3-Embedding-0.6B</text><rect class="d-chip" x="616.2" y="159" width="71.8" height="18" rx="9"/><text class="d-chiptext" x="652.1" y="172" text-anchor="middle">lokale KI</text><text class=