<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 602" class="d-quer" role="img" aria-labelledby="dq-titel dq-text"><title id="dq-titel">Aufbau von „Rede mit Meinungsmache“</title><desc id="dq-text">Stündlich prüft ein Abruf den RSS-Feed von meinungsmache.de, für das Archiv einmalig die Sitemap. Neue und geänderte Artikel werden von ihrer Seite gelesen und in Titel, Dachzeile, Text, Quelle, Autor und Links zerlegt. Ein lokales Sprachmodell schreibt zu jedem Artikel Fragen, Suchbegriffe und Themen; ein lokales Einbettungsmodell berechnet Vektoren für Text und Fragen. Alles landet in MariaDB. Bei jeder Frage ruft ein KI-Assistent die MCP-Schnittstelle auf; sie sucht in der Datenbank und liefert Artikel mit Links zu meinungsmache.de und zur Originalquelle zurück.</desc><style>
.d-bahn{fill:#f6f8fa;stroke:#d1d9e0;stroke-dasharray:4 4}
.d-bahntitel{fill:#59636e;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.d-kasten{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.2}
.d-t{fill:#1f2328;font-size:15px;font-weight:600}
.d-d{fill:#59636e;font-size:12.5px}
.d-f{fill:#806333;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace}
.d-p{fill:none;stroke:#59636e;stroke-width:1.4;stroke-linejoin:round}
.d-p.b{stroke:#a47f41;stroke-width:1.6}
.d-s{fill:#59636e}.d-s.b{fill:#a47f41}
.d-l{fill:#59636e;font-size:11.5px}.d-l.b{fill:#806333}
.d-chip{fill:#ffffff;stroke:#a47f41;stroke-width:1.1}
.d-chiptext{fill:#806333;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.d-hinweis{fill:#806333;font-size:11.5px;font-weight:600}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}</style><defs><marker id="dq-s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker><marker id="dq-sb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s b" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker></defs><rect class="d-bahn" x="4" y="4" width="856" height="330" rx="14"/><text class="d-bahntitel" x="20" y="26">Stündlich: Abruf von meinungsmache.de</text><rect class="d-kasten" x="20" y="70" width="200" height="70" rx="10"/><text class="d-t" x="120" y="101" text-anchor="middle">RSS-Feed</text><text class="d-d" x="120" y="119" text-anchor="middle">neue und geänderte Artikel</text><rect class="d-kasten" x="20" y="200" width="200" height="70" rx="10"/><text class="d-t" x="120" y="231" text-anchor="middle">Sitemap</text><text class="d-d" x="120" y="249" text-anchor="middle">Archiv seit Dezember 2025</text><rect class="d-kasten" x="250" y="135" width="230" height="70" rx="10"/><text class="d-t" x="365" y="159" text-anchor="middle">Abruf</text><text class="d-d" x="365" y="177" text-anchor="middle">Artikelseite lesen und zerlegen</text><text class="d-f" x="365" y="195" text-anchor="middle">abruf.php · quelle.php</text><rect class="d-kasten" x="510" y="44" width="230" height="70" rx="10"/><text class="d-t" x="625" y="75" text-anchor="middle">Artikel</text><text class="d-d" x="625" y="93" text-anchor="middle">Text, Quelle, Autor, Links</text><rect class="d-kasten" x="510" y="144" width="230" height="70" rx="10"/><text class="d-t" x="625" y="168" text-anchor="middle">Anreicherung</text><text class="d-d" x="625" y="186" text-anchor="middle">Fragen, Suchbegriffe, Themen</text><text class="d-f" x="625" y="204" text-anchor="middle">Gemma 4 · mm_anreichern.py</text><rect class="d-kasten" x="510" y="244" width="230" height="70" rx="10"/><text class="d-t" x="625" y="275" text-anchor="middle">Vektoren</text><text class="d-d" x="625" y="293" text-anchor="middle">Qwen3-Embedding-0.6B</text><rect class="d-chip" x="656.2" y="135" width="71.8" height="18" rx="9"/><text class="d-chiptext" x="692.1" y="148" text-anchor="middle">lokale KI</text><rect class="d-chip" x="656.2" y="235" width="71.8" height="18" rx="9"/><text class="d-chiptext" x="692.1" y="248" text-anchor="middle">lokale KI</text><text class="d-hinweis" x="844" y="26" text-anchor="end">Sprach- und Einbettungsmodell lokal auf eigener Hardware, ohne Cloud-Dienst</text><path class="d-kasten" d="M880,213 v244 a75,13 0 0 0 150,0 v-244"/><ellipse class="d-kasten" cx="955" cy="213" rx="75" ry="13"/><text class="d-t" x="955" y="329.5" text-anchor="middle">MariaDB</text><text class="d-d" x="955" y="347.5" text-anchor="middle">Artikel · Links</text><text class="d-d" x="955" y="365.5" text-anchor="middle">Volltext · Vektoren</text><polyline class="d-p" points="220,105 235,105 235,160 248,160" marker-end="url(#dq-s)"/><polyline class="d-p" points="220,235 235,235 235,180 248,180" marker-end="url(#dq-s)"/><polyline class="d-p" points="480,170 495,170 495,79 508,79" marker-end="url(#dq-s)"/><polyline class="d-p" points="625,114 625,142" marker-end="url(#dq-s)"/><polyline class="d-p" points="625,214 625,242" marker-end="url(#dq-s)"/><polyline class="d-p" points="740,79 800,79 800,240 878,240" marker-end="url(#dq-s)"/><polyline class="d-p" points="740,279 800,279 800,270 878,270" marker-end="url(#dq-s)"/><rect class="d-bahn" x="4" y="354" width="856" height="244" rx="14"/><text class="d-bahntitel" x="20" y="376">Bei jeder Frage</text><rect class="d-kasten" x="20" y="413" width="240" height="70" rx="10"/><text class="d-t" x="140" y="444" text-anchor="middle">KI-Assistent</text><text class="d-d" x="140" y="462" text-anchor="middle">Claude, ChatGPT, Grok, LM Studio</text><rect class="d-kasten" x="670" y="413" width="170" height="70" rx="10"/><text class="