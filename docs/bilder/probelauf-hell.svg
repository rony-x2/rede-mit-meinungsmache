<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 196" role="img" aria-labelledby="pl-titel pl-text"><title id="pl-titel">Aufbau von „Rede mit Meinungsmache“</title><desc id="pl-text">Stündlich prüft ein Abruf den RSS-Feed von meinungsmache.de, für das Archiv einmalig die Sitemap. Neue und geänderte Artikel werden von ihrer Seite gelesen und in Titel, Dachzeile, Text, Quelle, Autor und Links zerlegt. Ein lokales Sprachmodell schreibt zu jedem Artikel Fragen, Suchbegriffe und Themen; ein lokales Einbettungsmodell berechnet Vektoren für Text und Fragen. Alles landet in MariaDB. Bei jeder Frage ruft ein KI-Assistent die MCP-Schnittstelle auf; sie sucht in der Datenbank und liefert Artikel mit Links zu meinungsmache.de und zur Originalquelle zurück.</desc><style>
.d-bahn{fill:#f6f8fa;stroke:#d1d9e0;stroke-dasharray:4 4}
.d-bahntitel{fill:#59636e;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.d-kasten{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.2}
.d-t{fill:#1f2328;font-size:15px;font-weight:600}
.d-d{fill:#59636e;font-size:12.5px}
.d-f{fill:#806333;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace}
.d-p{fill:none;stroke:#59636e;stroke-width:1.4;stroke-linejoin:round}
.d-p.b{stroke:#a47f41;stroke-width:1.6}
.d-s{fill:#59636e}.d-s.b{fill:#a47f41}
.d-l{fill:#59636e;font-size:11.5px}.d-l.b{fill:#806333}
.d-chip{fill:#ffffff;stroke:#a47f41;stroke-width:1.1}
.d-chiptext{fill:#806333;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.d-hinweis{fill:#806333;font-size:11.5px;font-weight:600}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.d-balken{fill:#a47f41;opacity:.45}.d-balken2{fill:#a47f41}</style><defs><marker id="pl-s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker><marker id="pl-sb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s b" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker></defs><text class="d-bahntitel" x="16" y="22">Sekunden bis zur fertigen Antwort (Median, 10 Testfragen)</text><text class="d-t" x="16" y="62">Tesla P40 · Gemma 4 26B-A4B</text><text class="d-d" x="16" y="80">24 GB Grafikspeicher</text><rect class="d-kasten" x="330" y="50" width="430" height="26" rx="6"/><rect class="d-balken" x="330" y="50" width="82.9" height="26" rx="6"/><rect class="d-balken2" x="330" y="50" width="36.9" height="26" rx="6"/><text class="d-t" x="776" y="62">13,5 s</text><text class="d-d" x="776" y="80">≈ 4,5 Fragen/Min.</text><text class="d-t" x="16" y="124">Tesla P40 · Qwen3.8-27B</text><text class="d-d" x="16" y="142">24 GB Grafikspeicher</text><rect class="d-kasten" x="330" y="112" width="430" height="26" rx="6"/><rect class="d-balken" x="330" y="112" width="393.1" height="26" rx="6"/><rect class="d-balken2" x="330" y="112" width="156.6" height="26" rx="6"/><text class="d-t" x="776" y="124">64 s</text><text class="d-d" x="776" y="142">≈ 1 Frage/Min.</text><rect class="d-balken2" x="16" y="172" width="14" height="10" rx="3"/><text class="d-d" x="36" y="181">bis die Antwort beginnt</text><rect class="d-balken" x="196" y="172" width="14" height="10" rx="3"/><text class="d-d" x="216" y="181">bis sie fertig ist</text></svg>
