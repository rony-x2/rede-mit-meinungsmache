<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 482" class="d-quer" role="img" aria-labelledby="ds-titel ds-text"><title id="ds-titel">So findet „Rede mit Meinungsmache“ die passenden Artikel</title><desc id="ds-text">Eine Frage in eigenen Worten wird lokal eingebettet und mit zwei Listen verglichen: den Fragen, die ein Sprachmodell vorab zu jedem Artikel geschrieben hat, und den Textteilen der Artikel. Beide Ranglisten werden zusammengeführt, die erzeugten Fragen zählen etwas mehr. Die Volltextsuche springt nur ein, wenn die Einbettung ausfällt. Ein Briefing sucht nicht: Es nimmt alle Artikel eines Zeitraums und gliedert sie nach ihren Themen.</desc><style>
.d-bahn{fill:#151b23;stroke:#3d444d;stroke-dasharray:4 4}
.d-bahntitel{fill:#9198a1;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.d-kasten{fill:#0d1117;stroke:#3d444d;stroke-width:1.2}
.d-t{fill:#e6edf3;font-size:15px;font-weight:600}
.d-d{fill:#9198a1;font-size:12.5px}
.d-f{fill:#C5A46D;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace}
.d-p{fill:none;stroke:#9198a1;stroke-width:1.4;stroke-linejoin:round}
.d-p.b{stroke:#C5A46D;stroke-width:1.6}
.d-s{fill:#9198a1}.d-s.b{fill:#C5A46D}
.d-l{fill:#9198a1;font-size:11.5px}.d-l.b{fill:#C5A46D}
.d-chip{fill:#0d1117;stroke:#C5A46D;stroke-width:1.1}
.d-chiptext{fill:#C5A46D;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.d-hinweis{fill:#C5A46D;font-size:11.5px;font-weight:600}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}</style><defs><marker id="ds-s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker><marker id="ds-sb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s b" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker></defs><rect class="d-bahn" x="4" y="4" width="1182" height="330" rx="14"/><text class="d-bahntitel" x="20" y="26">Frage in eigenen Worten · Werkzeug bedeutung_suchen</text><rect class="d-kasten" x="20" y="120" width="150" height="70" rx="10"/><text class="d-t" x="95" y="151" text-anchor="middle">Frage</text><text class="d-d" x="95" y="169" text-anchor="middle">in eigenen Worten</text><rect class="d-kasten" x="196" y="120" width="220" height="70" rx="10"/><text class="d-t" x="306" y="151" text-anchor="middle">Frage einbetten</text><text class="d-d" x="306" y="169" text-anchor="middle">Qwen3, mit Suchanweisung</text><rect class="d-kasten" x="450" y="44" width="260" height="70" rx="10"/><text class="d-t" x="580" y="68" text-anchor="middle">Erzeugte Fragen</text><text class="d-d" x="580" y="86" text-anchor="middle">von Gemma 4, je Artikel 3 bis 5</text><text class="d-f" x="580" y="104" text-anchor="middle">mm_frage</text><rect class="d-kasten" x="450" y="144" width="260" height="70" rx="10"/><text class="d-t" x="580" y="168" text-anchor="middle">Artikeltext</text><text class="d-d" x="580" y="186" text-anchor="middle">Textteile, je Artikel der beste</text><text class="d-f" x="580" y="204" text-anchor="middle">mm_vektor</text><rect class="d-kasten" x="450" y="244" width="260" height="70" rx="10"/><text class="d-t" x="580" y="268" text-anchor="middle">Volltext</text><text class="d-d" x="580" y="286" text-anchor="middle">nur wenn die Einbettung ausfällt</text><text class="d-f" x="580" y="304" text-anchor="middle">mm_artikel</text><rect class="d-chip" x="626.2" y="35" width="71.8" height="18" rx="9"/><text class="d-chiptext" x="662.1" y="48" text-anchor="middle">lokale KI</text><rect class="d-chip" x="332.2" y="111" width="71.8" height="18" rx="9"/><text class="d-chiptext" x="368.1" y="124" text-anchor="middle">lokale KI</text><rect class="d-kasten" x="746" y="120" width="190" height="70" rx="10"/><text class="d-t" x="841" y="151" text-anchor="middle">Rank Fusion</text><text class="d-d" x="841" y="169" text-anchor="middle">Gewichte 1,0 · 0,75</text><rect class="d-kasten" x="970" y="120" width="200" height="70" rx="10"/><text class="d-t" x="1070" y="151" text-anchor="middle">Artikel</text><text class="d-d" x="1070" y="169" text-anchor="middle">Links, Quelle und Themen</text><polyline class="d-p" points="170,155 194,155" marker-end="url(#ds-s)"/><polyline class="d-p" points="416,155 432,155 432,79 448,79" marker-end="url(#ds-s)"/><polyline class="d-p" points="432,155 432,179 448,179" marker-end="url(#ds-s)"/><polyline class="d-p" points="95,190 95,279 448,279" marker-end="url(#ds-s)"/><text class="d-l" x="185" y="272" text-anchor="start">Wörter der Frage, nur als Ersatz</text><polyline class="d-p b" points="710,79 728,79 728,155 744,155" marker-end="url(#ds-sb)"/><polyline class="d-p b" points="710,179 728,179 728,155"/><polyline class="d-p b" points="710,279 728,279 728,179"/><polyline class="d-p b" points="936,155 968,155" marker-end="url(#ds-sb)"/><rect class="d-bahn" x="4" y="350" width="1182" height="128" rx="14"/><text class="d-bahntitel" x="20" y="372">Briefing · Werkzeug briefing</text><rect class="d-kasten" x="20" y="390" width="190" height="70" rx="10"/><text class="d-t" x="115" y="421" text-anchor="middle">Briefing-Wunsch</text><text class="d-d" x="115" y="439" text-anchor="middle">„Was war heute los?“</text><rect class="d-kasten" x="236" y="390" width="220" height="70" rx="10"/><text class="d-t" x="346" y="421" text-anchor="middle">Zeitraum</text><text class="d-d" x="346" y="439" text-anchor="middle">morgen · abend · tag · woche</text><rect class="d-kasten" x="482" y="390" width="228" height="70" rx="10"/><text class="d-t" x="596" y="414" text-anchor="middle">Alle Artikel</text><text class="d-d" x="596" y="432" text-anchor="middle">des Zeitraums, neueste zuerst</text><text class="d-f" x="596" y="450" text-anchor="middle">mm_artikel</text><rect class="d-kasten" x="736" y="390" width="200" height="70" rx="10"/><text class="d-t" x="836" y="414" text-anchor="middle">Nach Themen</text><text class="d-d" x="836" y="432" text-anchor="middle">aus der Anreicherung</text><text class="d-f" x="836" y="450" text-anchor="middle">mm_thema</text><rect class="d-kasten" x="962" y="390" width="208" height="70" rx="10"/><text class="d-t" x="1066" y="421" text-anchor="middle">Briefing</text><text class="d-d" x="1066" y="439" text-anchor="middle">Assistent fasst zusammen</text><rect class="d-chip" x="852.2" y="381" width="71.8" height="18" rx="9"/><text class="d-chiptext" x="888.1" y="394" text-anchor="middle">lokale KI</text><polyline class="d-p" points="210,425 234,425" marker-end="url(#ds-s)"/><polyline class="d-p" points="456,425 480,425" marker-end="url(#ds-s)"/><polyline class="d-p" points="710,425 734,425" marker-end="url(#ds-s)"/><polyline class="d-p b" points="936,425 960,425" marker-end="url(#ds-sb)"/></svg>
